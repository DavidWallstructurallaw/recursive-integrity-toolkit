name: Hero Scaffold Contract

on:
  push:
    paths:
      - "examples/hero/**"
      - "schemas/**"
      - "tests/integration/test_hero_structure.py"
      - ".github/workflows/golden.yml"
  pull_request:
    paths:
      - "examples/hero/**"
      - "schemas/**"
      - "tests/integration/test_hero_structure.py"
      - ".github/workflows/golden.yml"

permissions:
  contents: read

jobs:
  hero-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and Phase 1 test tools
        run: python -m pip install ".[test]"
      - name: Validate hero and schema structure only
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -p no:cacheprovider -q
          tests/integration/test_hero_structure.py
          tests/integration/test_schema_json.py

# Phase 1 does not generate or compare analytical golden reports.
