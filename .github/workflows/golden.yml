name: Phase 4 Step 11 Hero and Mathematical Contract

on:
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - "docs/**"
      - PHASE_4_COMPLETION.md
      - PHASE_4_VALIDATION_REPORT.md
      - PHASE_4_ARCHITECTURE_COMPLIANCE_REPORT.md
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hero-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install approved test tools
        run: python -m pip install ".[test]"
      - name: Verify all report goldens, packaged Hero and frozen mathematical oracles
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rit-math"
          python scripts/check_spec_consistency.py --phase 4 --step 11
          python -m pytest -p no:cacheprovider -q tests/integration/test_hero_structure.py tests/integration/test_hero_end_to_end.py tests/integration/test_phase3_metric_pipeline.py tests/golden/test_phase3_math.py tests/golden/test_phase4_reports.py --junitxml="$RUNNER_TEMP/rit-math/math.xml" | tee "$RUNNER_TEMP/rit-math/phase4_math_validation.log"
          python scripts/release_check.py --phase 4 --step 11 --golden-junit "$RUNNER_TEMP/rit-math/math.xml"
          python scripts/release_check.py --phase 4 --step 11 --diff
      - name: Retain actual Hero and mathematical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-current-hero-mathematical
          path: ${{ runner.temp }}/rit-math/
          if-no-files-found: error
          retention-days: 30
# Frozen mathematical expectations are unchanged; Step 11 Hero reports use independent assertions.
