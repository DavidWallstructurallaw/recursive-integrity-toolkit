name: Phase 3 Step 7 Hero Scaffold Contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hero-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install approved test tools
        run: python -m pip install ".[test]"
      - name: Validate unchanged Hero contract without analytical golden generation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/check_spec_consistency.py
          python -m pytest -p no:cacheprovider -q tests/integration/test_hero_structure.py
          python scripts/release_check.py --phase 3 --step 7 --diff
# No build_golden.py, normalize_golden.py or analytical report is executed.
