name: Phase 3 Step 11 Hero and Mathematical Contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hero-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install approved test tools
        run: python -m pip install ".[test]"
      - name: Verify Hero and frozen calculation oracles without generating a report
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rit-math"
          python scripts/check_spec_consistency.py
          python -m pytest -p no:cacheprovider -q tests/integration/test_hero_structure.py tests/integration/test_phase3_metric_pipeline.py tests/golden/test_phase3_math.py --junitxml="$RUNNER_TEMP/rit-math/math.xml" | tee "$RUNNER_TEMP/rit-math/phase3_math_validation.log"
          python scripts/release_check.py --junit "$RUNNER_TEMP/rit-math/math.xml"
          python scripts/release_check.py --phase 3 --step 11 --diff
      - name: Retain actual Hero and mathematical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-step11-hero-mathematical
          path: ${{ runner.temp }}/rit-math/
          if-no-files-found: error
          retention-days: 30
# No build_golden.py, normalize_golden.py or analytical report is executed.
