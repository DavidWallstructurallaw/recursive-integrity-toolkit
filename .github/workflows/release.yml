name: Phase 4 Step 1 Build and Candidate Evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Preserve canonical repository bytes
        run: git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install approved build and test tools
        run: python -m pip install ".[release,test]"
      - name: Run complete core regression without PyArrow
        env:
          RIT_TEST_PARQUET: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rit-phase4-step1"
          python -m pip freeze > "$RUNNER_TEMP/rit-phase4-step1/core-dependencies.txt"
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('pyarrow') is None"
          python -m pytest -p no:cacheprovider -q --junitxml="$RUNNER_TEMP/rit-phase4-step1/core.xml" | tee "$RUNNER_TEMP/rit-phase4-step1/phase4_test_results.log"
          python scripts/release_check.py --junit "$RUNNER_TEMP/rit-phase4-step1/core.xml" --minimum-tests 2489
      - name: Run complete real-Parquet regression
        env:
          RIT_TEST_PARQUET: "1"
        run: |
          set -euo pipefail
          python -m pip install ".[parquet]"
          python -m pip freeze > "$RUNNER_TEMP/rit-phase4-step1/parquet-dependencies.txt"
          python -m pip check
          python -c "import pyarrow; print('PyArrow', pyarrow.__version__)"
          python -m pytest -p no:cacheprovider -q --junitxml="$RUNNER_TEMP/rit-phase4-step1/parquet.xml" | tee "$RUNNER_TEMP/rit-phase4-step1/phase4_parquet_results.log"
          python scripts/release_check.py --junit "$RUNNER_TEMP/rit-phase4-step1/parquet.xml" --require-parquet --minimum-tests 2492
      - name: Check authority, declarations and current-step scope
        run: |
          set -euo pipefail
          python scripts/check_spec_consistency.py --phase 4 --step 1
          python scripts/check_traceability.py --phase 4 --step 1
          python scripts/release_check.py --phase 4 --step 1 --diff
          rit version
      - name: Build and verify the installed Step 1 baseline
        run: |
          set -euo pipefail
          python -m build --outdir "$RUNNER_TEMP/rit-phase4-step1/dist" | tee "$RUNNER_TEMP/rit-phase4-step1/phase4_build_results.log"
          python -m twine check --strict "$RUNNER_TEMP/rit-phase4-step1/dist/"*
          python scripts/release_check.py --phase 4 --step 1 --dist "$RUNNER_TEMP/rit-phase4-step1/dist" | tee "$RUNNER_TEMP/rit-phase4-step1/installed-wheel.log"
      - name: Produce the byte-verified Step 1 candidate archive
        env:
          RIT_TEST_PARQUET: "1"
        run: python scripts/release_check.py --phase 4 --step 1 --candidate "$RUNNER_TEMP/rit-phase4-step1"
      - name: Retain candidate or failure evidence without masking failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-integrity-toolkit-phase4-step1-candidate
          path: ${{ runner.temp }}/rit-phase4-step1/
          if-no-files-found: error
          retention-days: 90
