name: Phase 1 Release Scaffold

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install release tools
        run: python -m pip install ".[release,test]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed CLI
        run: |
          rit --help
          rit version
      - name: Verify license and repository scaffold
        run: python scripts/release_check.py

# Publishing is intentionally outside the Phase 1 workflow.
