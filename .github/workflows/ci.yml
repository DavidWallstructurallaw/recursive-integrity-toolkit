name: Phase 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    name: Scaffold checks on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and Phase 1 test tools
        run: python -m pip install ".[test]"
      - name: Run complete Phase 1 tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider -q
      - name: Check specification structure
        run: python scripts/check_spec_consistency.py
      - name: Check module traceability and no-algorithm boundary
        run: python scripts/check_traceability.py
      - name: Run release scaffold check
        run: python scripts/release_check.py
