name: Security boundaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  local-first-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RIT_TEST_PARQUET: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and approved test tools
        run: python -m pip install ".[test]"
      - name: Verify import, mapping, content-reference and orchestration boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rit-security"
          python -m pytest -p no:cacheprovider -q \
            tests/integration/test_no_network.py \
            tests/integration/test_optional_dependency.py \
            tests/integration/test_no_algorithms.py \
            tests/integration/test_prohibited_structure.py \
            tests/integration/test_license_notices.py \
            tests/unit/test_PR003_schema_mapping.py \
            tests/unit/test_PR017_content_refs.py \
            tests/integration/test_hero_end_to_end.py tests/golden/test_phase4_reports.py \
            tests/integration/test_partial_lineage_report.py \
            tests/integration/test_phase5_lineage_privacy.py tests/unit/test_lineage_root_resources.py \
            tests/unit/test_longitudinal_analysis.py::test_analysis_never_dispatches_graph_scenarios_or_io \
            tests/integration/test_longitudinal_reports.py::test_report_assembly_and_rendering_never_execute_series_or_graph_algorithms \
            tests/integration/test_longitudinal_reports.py::test_redacted_mapping_joins_remain_basis_local_and_keys_never_leak \
            tests/integration/test_longitudinal_reports.py::test_redacted_versions_join_context_and_retained_chronology \
            tests/integration/test_longitudinal_reports.py::test_standard_markdown_keeps_state_literals_inert \
            tests/integration/test_longitudinal_cli.py::test_validate_repeated_comparisons_and_enabled_config_never_execute \
            tests/integration/test_longitudinal_cli.py::test_redacted_output_hides_literal_mapping_keys_values_and_paths \
            tests/integration/test_longitudinal_cli.py::test_existing_output_is_preserved_byte_for_byte \
            tests/integration/test_longitudinal_installed.py::test_installed_record_loaders_baseline_and_privacy_modes \
            tests/integration/test_scenario_reports.py::test_scenario_privacy_preserves_state_alignment_in_all_record_modes \
            tests/integration/test_scenario_reports.py::test_privacy_and_rendering_never_dispatch_numerics_or_rng \
            tests/integration/test_scenario_cli.py::test_disabled_scenarios_are_inert_during_audit \
            tests/integration/test_scenario_cli.py::test_validate_scenario_declarations_never_import_sampler_or_numpy \
            tests/integration/test_scenario_cli.py::test_redacted_scenario_cli_protects_configuration_text_and_all_output_sinks \
            tests/integration/test_scenario_adversarial.py::test_cli_budget_refusal_precedes_sampling_and_emits_no_successful_paths \
            tests/integration/test_simulation_installed.py::test_packaged_simulation_outside_checkout_with_network_blocked \
            tests/unit/test_T1_representation.py \
            tests/unit/test_PR006_duplicates.py \
            tests/unit/test_T1_support.py \
            tests/unit/test_T1_diversity.py \
            tests/unit/test_PR004_coverage.py \
            tests/unit/test_PR005_source_shares.py \
            tests/unit/test_T3_provenance.py \
            tests/unit/test_T3_bounds.py \
            tests/unit/test_T2_tail.py \
            tests/unit/test_T1_resampling.py \
            tests/unit/test_T1_compatibility.py \
            tests/integration/test_phase3_metric_pipeline.py \
            tests/unit/test_PR012_evidence_classes.py \
            tests/unit/test_PR013_report_schema.py \
            tests/unit/test_PR014_unavailable.py \
            tests/unit/test_PR015_redaction.py \
            tests/unit/test_PR016_determinism.py \
            tests/unit/test_PR018_language.py \
            tests/integration/test_partial_provenance_report.py \
            tests/unit/test_phase4_output_safety.py \
            tests/integration/test_phase4_cli.py \
            --junitxml="$RUNNER_TEMP/rit-security/security.xml" | tee "$RUNNER_TEMP/rit-security/tests.log"
          python scripts/release_check.py --junit "$RUNNER_TEMP/rit-security/security.xml"
          python scripts/check_traceability.py
          python scripts/release_check.py
      - name: Retain actual security test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-security-boundary
          path: ${{ runner.temp }}/rit-security/
          if-no-files-found: error
          retention-days: 30
